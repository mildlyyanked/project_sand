name: Android release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: Version name (defaults to package.json version, or the tag)
        required: false

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CI: 1
      EXPO_NO_TELEMETRY: 1
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3
        with:
          accept-android-sdk-licenses: true
          log-accepted-android-sdk-licenses: false

      - uses: gradle/actions/setup-gradle@v4

      - run: npm ci

      - name: Typecheck and tests
        run: |
          npm run typecheck
          npm test

      - name: Resolve version
        id: v
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then V="${{ github.event.inputs.version }}"
          elif [[ "$GITHUB_REF" == refs/tags/v* ]]; then V="${GITHUB_REF#refs/tags/v}"
          else V="$(node -p "require('./package.json').version")"; fi
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "code=$GITHUB_RUN_NUMBER" >> "$GITHUB_OUTPUT"

      - name: Generate native project
        env:
          APP_VERSION: ${{ steps.v.outputs.version }}
          ANDROID_VERSION_CODE: ${{ steps.v.outputs.code }}
        run: npx expo prebuild --platform android --no-install

      - name: Keystore
        id: ks
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -e
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > android/app/release.keystore
            echo "stable=true" >> "$GITHUB_OUTPUT"
          else
            KEYSTORE_PASSWORD="sand-ci-$(openssl rand -hex 8)"; KEY_ALIAS="sand"; KEY_PASSWORD="$KEYSTORE_PASSWORD"
            keytool -genkeypair -v -keystore android/app/release.keystore -alias "$KEY_ALIAS" \
              -keyalg RSA -keysize 2048 -validity 10000 -storepass "$KEYSTORE_PASSWORD" -keypass "$KEY_PASSWORD" \
              -dname "CN=Sand, OU=CI, O=Sand" >/dev/null 2>&1
            echo "stable=false" >> "$GITHUB_OUTPUT"
          fi
          {
            echo "SAND_STORE_FILE=release.keystore"
            echo "SAND_STORE_PASSWORD=$KEYSTORE_PASSWORD"
            echo "SAND_KEY_ALIAS=$KEY_ALIAS"
            echo "SAND_KEY_PASSWORD=$KEY_PASSWORD"
          } >> android/gradle.properties
          node scripts/android-signing.js

      - name: Build APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon

      - name: Collect
        id: apk
        run: |
          OUT="sand-${{ steps.v.outputs.version }}.apk"
          cp android/app/build/outputs/apk/release/app-release.apk "$OUT"
          echo "file=$OUT" >> "$GITHUB_OUTPUT"
          {
            echo "### Sand ${{ steps.v.outputs.version }} (build ${{ steps.v.outputs.code }})"
            if [ "${{ steps.ks.outputs.stable }}" = "true" ]; then
              echo "Signed with the repository keystore. Installs over previous builds."
            else
              echo "> Signed with a throwaway key: no \`ANDROID_KEYSTORE_BASE64\` secret is set. Uninstall the previous build before installing this one. See README for a stable key."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.apk.outputs.file }}
          path: ${{ steps.apk.outputs.file }}
          if-no-files-found: error

      - name: GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.apk.outputs.file }}
          generate_release_notes: true
