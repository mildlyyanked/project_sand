name: Android release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: Version name (defaults to package.json version)
        required: false
      release:
        description: Also publish a GitHub Release tagged v<version>
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CI: 1
      EXPO_NO_TELEMETRY: 1
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Accept Android SDK licenses
        # ubuntu-latest ships the Android SDK; Gradle fetches any missing pieces once licenses are accepted.
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null 2>&1 || true

      - uses: gradle/actions/setup-gradle@v4

      - run: npm ci

      - name: Typecheck and tests
        run: |
          npm run typecheck
          npm test

      - name: Resolve version
        id: v
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then V="${{ github.event.inputs.version }}"
          elif [[ "$GITHUB_REF" == refs/tags/v* ]]; then V="${GITHUB_REF#refs/tags/v}"
          else V="$(node -p "require('./package.json').version")"; fi
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "code=$GITHUB_RUN_NUMBER" >> "$GITHUB_OUTPUT"

      - name: Generate native project
        env:
          APP_VERSION: ${{ steps.v.outputs.version }}
          ANDROID_VERSION_CODE: ${{ steps.v.outputs.code }}
        run: npx expo prebuild --platform android --no-install

      - name: Keystore
        id: ks
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -e
          if [ -n "$KEYSTORE_BASE64" ]; then
            # Private key from repository secrets.
            echo "$KEYSTORE_BASE64" | base64 -d > android/app/release.keystore
            {
              echo
              echo "SAND_STORE_FILE=release.keystore"
              echo "SAND_STORE_PASSWORD=$KEYSTORE_PASSWORD"
              echo "SAND_KEY_ALIAS=$KEY_ALIAS"
              echo "SAND_KEY_PASSWORD=$KEY_PASSWORD"
            } >> android/gradle.properties
            echo "source=secrets" >> "$GITHUB_OUTPUT"
          elif [ -f android-signing/signing.properties ]; then
            # Committed key (see android-signing/README.md). Stable signature, public key.
            { echo; cat android-signing/signing.properties; } >> android/gradle.properties
            echo "source=repo" >> "$GITHUB_OUTPUT"
          else
            KEYSTORE_PASSWORD="sand-ci-$(openssl rand -hex 8)"
            keytool -genkeypair -v -keystore android/app/release.keystore -alias sand \
              -keyalg RSA -keysize 2048 -validity 10000 -storepass "$KEYSTORE_PASSWORD" -keypass "$KEYSTORE_PASSWORD" \
              -dname "CN=Sand, OU=CI, O=Sand" >/dev/null 2>&1
            {
              echo
              echo "SAND_STORE_FILE=release.keystore"
              echo "SAND_STORE_PASSWORD=$KEYSTORE_PASSWORD"
              echo "SAND_KEY_ALIAS=sand"
              echo "SAND_KEY_PASSWORD=$KEYSTORE_PASSWORD"
            } >> android/gradle.properties
            echo "source=throwaway" >> "$GITHUB_OUTPUT"
          fi
          node scripts/android-signing.js

      - name: Trace node invocations
        # Gradle swallows stderr from the node one-liners it runs at configure time.
        # Shim node on PATH so every call, its exit code and stderr land in a log.
        run: |
          mkdir -p "$RUNNER_TEMP/nodeshim"
          REAL_NODE="$(command -v node)"
          cat > "$RUNNER_TEMP/nodeshim/node" <<EOF
          #!/usr/bin/env bash
          LOG="$RUNNER_TEMP/node-trace.log"
          ERR="\$(mktemp)"
          "$REAL_NODE" "\$@" 2>"\$ERR"
          RC=\$?
          cat "\$ERR" >&2
          { echo "== node \$* (cwd \$PWD) exit \$RC"; cat "\$ERR"; } >> "\$LOG"
          rm -f "\$ERR"
          exit \$RC
          EOF
          chmod +x "$RUNNER_TEMP/nodeshim/node"
          echo "$RUNNER_TEMP/nodeshim" >> "$GITHUB_PATH"

      - name: Build APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Node trace
        if: failure()
        run: grep -B1 -A15 "exit [1-9]" "$RUNNER_TEMP/node-trace.log" || echo "no failing node calls recorded"

      - name: Collect
        id: apk
        run: |
          OUT="sand-${{ steps.v.outputs.version }}.apk"
          cp android/app/build/outputs/apk/release/app-release.apk "$OUT"
          echo "file=$OUT" >> "$GITHUB_OUTPUT"
          {
            echo "### Sand ${{ steps.v.outputs.version }} (build ${{ steps.v.outputs.code }})"
            case "${{ steps.ks.outputs.source }}" in
              secrets) echo "Signed with the private keystore from repository secrets. Installs over previous builds." ;;
              repo) echo "Signed with the committed keystore (android-signing/). Installs over previous builds signed the same way." ;;
              *) echo "> Signed with a throwaway key. Uninstall the previous build before installing this one." ;;
            esac
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.apk.outputs.file }}
          path: ${{ steps.apk.outputs.file }}
          if-no-files-found: error

      - name: GitHub release
        if: startsWith(github.ref, 'refs/tags/v') || inputs.release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.v.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: Sand ${{ steps.v.outputs.version }}
          files: ${{ steps.apk.outputs.file }}
          generate_release_notes: true
